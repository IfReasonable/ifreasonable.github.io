title: "Haolong Chen"
name: "Haolong Chen"
description: "Personal website of Haolong Chen — research on LLM agents and domain-specific intelligence."
url: "https://ifreasonable.github.io"
baseurl: ""
lang: "en"
timezone: "Asia/Shanghai"

markdown: kramdown
permalink: pretty

collections:
  publications:
    output: false
  patents:
    output: false

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - CONTRIBUTING.md
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - markdown_generator
  - scripts
  - talkmap
  - _drafts
  - _pages
  - _portfolio
  - _posts
  - _talks
  - _teaching
