<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}" sizes="any">
    <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="site-name" href="#top" aria-label="Back to top">Haolong Chen</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="#about">About</a>
          <a href="#news">News</a>
          <a href="#publications">Publications</a>
          <a href="#patents">Patents</a>
          <a href="#education">Education</a>
        </nav>
      </div>
    </header>
    <main id="content" class="page" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>&copy; {{ 'now' | date: '%Y' }} Haolong Chen. Built with Markdown and GitHub Pages.</p>
    </footer>
  </body>
</html>
